[project]
name = "ai-vault"
version = "0.1.0"
description = "AI-powered document vault with RAG chat (hiring case study)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
# Versions verified on PyPI on 2026-10-15 (T01); exact pins live in uv.lock.
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",  # newest version allowed by kombu 5.6.2
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "langchain-core==1.6.10",
    "langchain-openai==1.7.2",
    "langchain-text-splitters==1.1.3",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "reportlab==5.0.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: calls the real OpenAI API; needs RUN_LIVE_AI_TESTS=1 and explicit spend approval",
]
addopts = "-m 'not live' -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
